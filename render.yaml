# Render Blueprint for PactFlow.
#
# Two details drive this file. First, PactFlow keeps its data in SQLite, and
# Render's filesystem is ephemeral by default: without the disk below, the
# database file and every uploaded deliverable would disappear on each deploy.
# `DATABASE_URL` and `LOCAL_STORAGE_DIR` therefore both point inside the mount.
#
# Second, the start command seeds the demo data exactly once. `prisma/seed.ts`
# uses plain `create` calls, so running it on every boot would collide with the
# rows the previous boot wrote. The marker file lives on the same disk, which
# makes it survive restarts but disappear with a fresh disk.
#
# Persistent disks require a paid instance type; the free plan cannot mount one.
# The `starter` plan below is therefore not optional. Render credits (Billing ->
# Credit Balance) are deducted at the END of each billing period, so a payment
# method is still requested when the service is created; the credit balance is
# what keeps that card from being charged.
services:
  - type: web
    name: pactflow
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand:
      npm run db:push -- --skip-generate && (test -f /var/data/.seeded || (npm run db:seed && touch /var/data/.seeded)) && npm start
    healthCheckPath: /login
    autoDeploy: true
    disk:
      name: pactflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/var/data/pactflow.db
      - key: LOCAL_STORAGE_DIR
        value: /var/data/storage
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: PAYPAL_WEBHOOK_SECRET
        generateValue: true
      # Sandbox mode calls real PayPal APIs (Orders v2, Payouts, Webhook Verification).
      # Until PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET are filled in, the app logs a
      # "[paypal] PAYPAL_MODE=sandbox but ... empty" warning and runs the local mock
      # checkout — so an early deploy looks live without actually being live.
      - key: PAYPAL_MODE
        value: sandbox
      # Public URL of the service, e.g. https://pactflow.onrender.com. Prompted
      # on first deploy because it is only known once the service exists.
      - key: APP_URL
        sync: false
      # GroqCloud LLM configuration (OpenAI-compatible chat completions)
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      # PayPal Sandbox credentials
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # REQUIRED in sandbox mode. Deliveries are verified ONLY through PayPal's
      # verify-webhook-signature API against this id — there is no shared-secret
      # fallback (PAYPAL_WEBHOOK_SECRET is mock-mode only), so leaving it unset
      # rejects every real webhook and captures land solely through the return
      # page. It is the id shown when the webhook is created in the PayPal
      # dashboard, not the webhook URL.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Percentage of each captured milestone the platform keeps before the
      # Freelancer payout (0-50). Unset means 0, i.e. the Freelancer is paid in
      # full and no platform fee shows in the demo.
      - key: PLATFORM_FEE_PERCENT
        sync: false
      # Browser-side, so it is public by nature — but it stays out of source
      # control all the same: `sync: false` makes Render prompt for it once and
      # keep it in the dashboard only. NEXT_PUBLIC_* is inlined into the client
      # bundle at BUILD time, so setting it after a deploy needs a rebuild.
      - key: NEXT_PUBLIC_BRYNTUM_LICENSE_KEY
        sync: false
      # Optional: comma-separated operators allowed to read /api/audit and run cron.
      - key: OPERATOR_EMAILS
        sync: false
      - key: CRON_SECRET
        generateValue: true
